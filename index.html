<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OOL V2 · Ficha del objeto luminoso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Jura:wght@300;400;500;600&family=Big+Shoulders+Display:wght@700&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f1eee7;--ink:#262a2e;--muted:#787c82;--line:#cdc8be;--card:#fbfaf7;--conf:#c4503c;--radius:12px;--shadow:0 24px 70px rgba(38,41,46,.14);
  --f-display:Gloock,serif;--f-ui:Jura,system-ui,sans-serif;--f-mono:'Red Hat Mono',monospace;--f-plane:'Big Shoulders Display',sans-serif;--w-display:400;--w-plane:700;--ls-plane:.12em;--ls-kicker:.09em}
/* Tema Vibia — tipografía (Gordita, servida desde su CDN) y paleta tomadas de vibia.com (04/09/2026) */
@font-face{font-family:Gordita;font-weight:300;src:url(https://assets.vibiacdn.com/fonts/gorditalight.woff2) format("woff2");font-display:swap}
@font-face{font-family:Gordita;font-weight:400;src:url(https://assets.vibiacdn.com/fonts/gorditaregular.woff2) format("woff2");font-display:swap}
@font-face{font-family:Gordita;font-weight:500;src:url(https://assets.vibiacdn.com/fonts/gorditamedium.woff2) format("woff2");font-display:swap}
body[data-theme=vibia]{--paper:#f6f2f0;--ink:#010101;--muted:#807c7e;--line:#e1dbd3;--card:#fcfbfc;--conf:#e1736d;--radius:4px;--shadow:0 8px 30px rgba(1,1,1,.08);
  --f-display:Gordita,sans-serif;--f-ui:Gordita,sans-serif;--f-mono:Gordita,sans-serif;--f-plane:Gordita,sans-serif;--w-display:300;--w-plane:500;--ls-plane:.22em;--ls-kicker:.14em}
body[data-theme=vibia] .hdr h1{font-weight:300;letter-spacing:-.01em}
body[data-theme=vibia] .card h2{font-weight:300}
body[data-theme=vibia] .card .kicker,body[data-theme=vibia] .kv b,body[data-theme=vibia] .hint,body[data-theme=vibia] .legend,body[data-theme=vibia] .hdr .meta,body[data-theme=vibia] .flist .id,body[data-theme=vibia] .flist .st,body[data-theme=vibia] .rel .tag,body[data-theme=vibia] .tags span,body[data-theme=vibia] .pill,body[data-theme=vibia] .saved{text-transform:uppercase;letter-spacing:.12em;font-size:9.5px;font-weight:500}
body[data-theme=vibia] .sel,body[data-theme=vibia] .theme{border-radius:4px}body[data-theme=vibia] .sel button,body[data-theme=vibia] .theme button{border-radius:3px;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px}
body[data-theme=vibia] .plate .zlabel{font-weight:400}body[data-theme=vibia] .plate .flabel{font-weight:400}
body[data-theme=vibia] .plate .plabel{fill:var(--card);font-size:18px;letter-spacing:.16em}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-weight:500;overflow:hidden;transition:background .3s}
.stage{position:fixed;inset:0;display:grid;place-items:center;transition:right .35s ease}
body.hascard .stage{right:490px}
svg.plate{width:min(100vh,100%);height:min(100vh,100vw);max-width:100%;display:block;overflow:visible;transition:width .35s ease}
.hdr{position:fixed;top:26px;left:36px;pointer-events:none}
.hdr h1{font-family:var(--f-display);font-weight:var(--w-display);font-size:54px;line-height:1;margin:0 0 6px}
.hdr .sub{font-size:14px;color:var(--muted)}
.hdr .meta{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.base{position:fixed;top:78px;right:36px;width:400px;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);display:none;z-index:5}
.base.on{display:block}
.base .close{position:absolute;top:8px;right:12px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.base .kicker{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.baserow{display:flex;gap:8px;margin:10px 0 8px;align-items:center}
.baserow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;background:#fff}
.seg2{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}.seg2 button{border:0;background:none;font:inherit;font-size:11px;padding:4px 9px;border-radius:999px;cursor:pointer;color:var(--muted)}.seg2 button.on{background:var(--ink);color:var(--paper)}
.bgrp{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.bl{display:flex;gap:10px;align-items:center;padding:7px 6px;border-radius:8px;cursor:pointer;font-size:14px}.bl:hover{background:rgba(0,0,0,.04)}.bl.on{background:rgba(0,0,0,.07)}
.bl img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#fff;border:1px solid var(--line);flex:none}
.bl .n{flex:1}.bl .n small{display:block;color:var(--muted);font-size:11.5px}.bl .st{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.ool-actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.ool-actions button,.ool-send{border:1px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);padding:6px 11px;font:inherit;font-size:11.5px;cursor:pointer}.ool-actions button:first-child,.ool-send{background:var(--ink);color:var(--paper)}
.ool-brief{display:none;margin:8px 0 12px}.ool-brief.on{display:block}.ool-brief textarea{min-height:76px}.ool-brief .ool-send{margin-top:7px}.ool-msg{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);min-height:15px;margin:6px 0}
.ool-job{padding:9px 0;border-top:1px dashed var(--line);font-size:12.5px}.ool-job-head{display:flex;gap:8px;align-items:baseline}.ool-job-head b{flex:1}.ool-job .stage-label{font-family:var(--f-mono);font-size:10px;color:var(--muted)}.ool-job .err{color:var(--conf);margin-top:5px}.ool-questions{margin-top:8px}.ool-questions ul{margin:5px 0 8px;padding-left:18px}.ool-questions textarea{min-height:70px}.ool-empty{font-size:12px;color:var(--muted);margin:8px 0}
.sel.theme{top:78px}
.sel{position:fixed;top:32px;right:36px;display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(255,255,255,.5)}
.sel button{border:0;background:none;font:inherit;font-size:12.5px;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
.sel button.on{background:var(--ink);color:var(--paper)}
.hint{position:fixed;bottom:24px;left:36px;max-width:calc(100% - 640px);line-height:1.5;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.legend{position:fixed;bottom:24px;right:36px;display:flex;gap:22px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px;background:var(--ink);width:8px}
.legend .st{display:inline-flex;gap:3px;align-items:center;margin-right:4px}.legend .st i{width:10px;height:8px}
/* V2 · capa de lectura D·M·G (01/10): tercer grupo de la leyenda, un activo a la vez; no recolorea los planos — punto de tinta en la punta de la barra */
.legend .lect{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:8px}
.lbtn{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:inherit;padding:3px 9px;line-height:1.3;cursor:pointer}
.lbtn:hover{border-color:var(--ink);color:var(--ink)}.lbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.lbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.plate .ldot,.plate .pdot{fill:var(--ink);pointer-events:none}
.plate .pmark{font-family:var(--f-mono);font-size:7.5px;letter-spacing:.1em;fill:var(--ink);pointer-events:none}.plate .pmark.off{fill-opacity:.25}
.plate.lect .clabel{fill-opacity:.25}
.card .kicker a{cursor:pointer;color:var(--ink)}.card .kicker a:hover{text-decoration:underline}
.lrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.4}
.lrow a{flex:1;cursor:pointer;color:inherit}.lrow a:hover{text-decoration:underline}.lrow a small{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-right:6px}.lrow a small.z{margin:0 0 0 6px}
.lmv{display:inline-flex;gap:3px;flex:none}.lmv button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:var(--f-mono);font-size:10.5px;padding:0;cursor:pointer}
.lmv button:hover{border-color:var(--ink);color:var(--ink)}.lmv button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);cursor:default}.lmv button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.lacts{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}.lacts button{border:1px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);padding:5px 11px;font:inherit;font-size:11.5px;cursor:pointer}.lacts button:disabled{opacity:.4;cursor:default}
.lcopy{display:none;margin-top:8px}.lcopy.on{display:block}.lcopy textarea{font-family:var(--f-mono);font-size:11px;min-height:90px}
/* la tarjeta */
.card{position:fixed;right:36px;top:50%;transform:translateY(-50%);width:440px;max-height:86vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px 24px;box-shadow:var(--shadow);display:none}
.card.on{display:block}
.card .close{position:absolute;top:12px;right:14px;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.card .kicker{font-family:var(--f-mono);font-size:10.5px;letter-spacing:var(--ls-kicker);text-transform:uppercase;color:var(--muted)}
.card .kicker b{color:var(--ink);font-weight:500}
.card h2{font-family:var(--f-display);font-weight:var(--w-display);font-size:29px;line-height:1.1;margin:8px 0 4px}
.card .q{color:var(--muted);font-size:14px}
.card .hrow{display:flex;align-items:flex-start;gap:10px}.card .hrow h2{flex:1}
.card .help{flex:none;margin-top:12px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line,#cfc9bf);background:transparent;color:var(--muted);font-family:var(--f-mono);font-size:14px;line-height:24px;text-align:center;cursor:pointer;padding:0}
.card .help:hover,.card .help.on{background:var(--ink);color:var(--paper,#f1eee7);border-color:var(--ink)}
.card .guide .kicker{color:var(--ink)}
.card .guide .def{margin:6px 0 10px;padding-left:10px;border-left:2px solid var(--line,#cfc9bf)}
.card .guide .def b{display:block;font-weight:500}
.card .guide .def small{color:var(--muted)}
.sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.sec .kicker{margin-bottom:9px}
.human{font-size:14.5px;line-height:1.6}
.human p{margin:0 0 10px}
.val{font-size:17px;line-height:1.4;margin:2px 0 8px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:7px 12px;font-size:13.5px;line-height:1.4}
.kv b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding-top:3px}
.kv a{color:inherit}
.flist .f{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:13.5px;align-items:center}
.flist .f:hover{background:rgba(0,0,0,.03)}
.flist .f .id{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);width:42px;flex:none}
.flist .f .n{flex:1}
.flist .f .bar{width:64px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.flist .f .bar i{display:block;height:100%}
.flist .f .st{font-family:var(--f-mono);font-size:10px;color:var(--muted);width:82px;text-align:right;flex:none}
.zlist .z{padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center}
.zlist .z i{width:10px;height:10px;border-radius:2px;flex:none}
.zlist .z small{color:var(--muted);margin-left:auto;font-family:var(--f-mono);font-size:10.5px}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vocab span{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px}
.vocab span.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:13px;line-height:1.45;min-height:64px;background:#fff;resize:vertical}
textarea:focus{outline:2px solid #d9d3c4}
.saved{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:5px;min-height:14px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;background:rgba(0,0,0,.06)}
.pill.conf{background:var(--conf);color:#fff}
/* V2 · estado de proyecto en cuatro valores (Fran 02/10 01:22): pill arriba de la ficha junto a la importancia y, debajo, origen y validación en una línea discreta; marca discreta en listas; la evidencia queda en la trazabilidad */
.fstate{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.pill.pd{background:transparent;border:1px solid var(--ink);color:var(--ink)}.pill.pd[data-pd=incertidumbre]{border-style:dashed}.pill.pd[data-pd=hipotesis]{border-style:dotted}.pill.pd[data-pd=libre]{border-color:var(--muted);color:var(--muted)}
.forig{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.03em;color:var(--muted);margin:5px 0 0}
.pdm{font-family:var(--f-mono);font-size:10px;letter-spacing:.03em;color:var(--muted);margin-left:6px;white-space:nowrap}
/* svg */
.plate text{font-family:var(--f-ui);font-weight:500;fill:var(--ink)}
.plate .hit{cursor:pointer}
.plate .blk{transition:opacity .18s}
.plate.dim .blk,.plate.dim .zring,.plate.dim .parc,.plate.dim .flabel,.plate.dim .zlabel,.plate.dim .plabel{opacity:.22}
.plate.dim .sel{opacity:1}
.plate .zring:hover,.plate .parc:hover{filter:brightness(.92)}
.plate .blk:hover{filter:brightness(.85)}
.plate .flabel{font-size:11.5px;pointer-events:all;cursor:pointer}.plate .flabel.ia{opacity:1!important}
.plate .flabel.lo{fill:var(--muted)}
.plate .flabel.top{font-size:12.5px;font-weight:600}
.plate .zlabel{font-size:11px;pointer-events:none}
.plate .zlabel.rad{font-size:11px;letter-spacing:.01em}
.plate .plabel{font-family:var(--f-plane);font-weight:var(--w-plane);font-size:23px;letter-spacing:var(--ls-plane);fill:var(--paper);pointer-events:none}
.plate .scale{fill:none;stroke:var(--line);stroke-width:.8;stroke-dasharray:2.5 5}
.plate .chord path{fill:none;stroke-linejoin:round;pointer-events:stroke}
.plate .chord .curve{stroke:#dedad2;stroke-opacity:.7;stroke-width:.4}
.plate .chord.wide{display:none}
/* al seleccionar: las cuerdas siguen SIEMPRE por atrás; las elegidas suben a gris medio (nunca negro), el resto casi desaparece */
.plate.dim .chord{opacity:.08}
.plate.dim .chord.sel{display:block;opacity:1}
.plate.dim .chord.sel .curve{stroke:#8e8981;stroke-opacity:.95;stroke-width:.7}
/* lo seleccionado queda semitransparente para que las cuerdas se vean pasar por debajo */
/* siempre un poco de transparencia (también en reposo) para que las cuerdas se adivinen por atrás */
.plate .zring{fill-opacity:.86}
.plate .parc{fill-opacity:.9}
.plate.dim .zring.sel{fill-opacity:.78}
.plate.dim .parc{fill-opacity:.82}
.plate.dim .blk.sel{fill-opacity:.88}
.plate.dim .blk.rel{fill-opacity:.8}
.plate.dim .blk.rel,.plate.dim .flabel.rel{opacity:.7}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tags span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.rel{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.5}
.rel .tag{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);display:block;margin-bottom:2px}
.rel a{display:block;cursor:pointer;color:inherit}.rel a:hover{text-decoration:underline}
.rel a small{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-right:6px}
.plate .knot{fill:var(--ink)}
/* V2 · centro (Programa proyectual), tres anillos de Identidad (bandas Objeto · Familia · Marca) y conexiones por selección */
.plate .clabel{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;fill:var(--ink);fill-opacity:.75;pointer-events:none}
.plate.dim .clabel.sel{fill-opacity:1}
.plate [tabindex]:focus{outline:none}.plate #center:focus-visible{stroke:var(--ink);stroke-width:1.5}
.plate .blk:focus-visible{stroke:var(--ink);stroke-width:1.5}
.plate .iring{fill:none;stroke:#8e8981;stroke-width:1.5}
.plate .isel{font-family:var(--f-ui);font-weight:300;font-size:20px;letter-spacing:.32em;fill:var(--muted);text-transform:uppercase}.plate .isel.off{fill-opacity:.3} /* Fran (01/10): las tres en el mismo círculo, un solo tamaño, lo más grande posible; las inactivas en gris clarito */
.plate .isel{cursor:pointer}.plate .isel:hover,.plate .isel.on{fill:var(--ink);fill-opacity:1}
.plate .inode{fill:#8e8981}
.plate .iline{stroke:#8e8981;stroke-width:1.5;fill:none}
.plate .ilabel{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;fill:var(--ink);cursor:pointer;text-transform:uppercase}
.plate.dim .inode,.plate.dim .iline,.plate.dim .ilabel,.plate.dim .iring{opacity:.22}.plate.dim .ident .isel.on,.plate.dim .ident .iring.on,.plate.dim .ident .iline,.plate.dim .ident .inode,.plate.dim .ident .ilabel{opacity:1}
.plate.dim .inode.sel,.plate.dim .iline.sel,.plate.dim .ilabel.sel{opacity:1}
.plate .xlinks,.plate .xlinks path,.plate .iline{pointer-events:none!important}
.plate .isel [tabindex]:focus-visible{fill:var(--ink);text-decoration:underline}
.det{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.5}
.det .t{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.det .m{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.03em;margin-top:3px;line-height:1.7}
.det .m a{cursor:pointer;color:inherit}.det .m a:hover{text-decoration:underline}
.det.hl,.sec.hl{background:rgba(0,0,0,.05);border-radius:6px;padding:8px 6px}
.pitem{padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:13.5px;line-height:1.5}
.pitem:hover{background:rgba(0,0,0,.03)}
.pitem small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:3px}
.pitem .e{display:block;font-size:14.5px;line-height:1.45}
.pitem .w{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.5}
.pill.lg{cursor:pointer}.pill.lg:hover{background:var(--ink);color:var(--paper)}
.pill.unk{background:none;border:1px solid var(--ink)}
.guide ul{margin:4px 0 8px;padding-left:18px;font-size:13px;line-height:1.5}
.rel .why{display:block;color:var(--muted);font-size:12px}
details.trace{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
details.trace summary{cursor:pointer;font-family:var(--f-mono);font-size:10.5px;letter-spacing:var(--ls-kicker);text-transform:uppercase;color:var(--muted);list-style:none}
details.trace summary::-webkit-details-marker{display:none}
details.trace summary::before{content:'+ '}details.trace[open] summary::before{content:'− '}
/* V2 · Vocabulario controlado (01/10): sección genérica de la ayuda «?» del campo, para todo campo con `vocabulario` en defs; todos los términos en su orden, los que aplican a la lámpara abierta marcados (.vt.on) */
details.vocabulario{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
details.vocabulario summary{cursor:pointer;font-family:var(--f-mono);font-size:10.5px;letter-spacing:var(--ls-kicker);text-transform:uppercase;color:var(--muted);list-style:none}
details.vocabulario summary::-webkit-details-marker{display:none}
details.vocabulario summary::before{content:'− '}details.vocabulario:not([open]) summary::before{content:'+ '}
details.vocabulario summary:focus-visible,.vt>button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

const LKEYP='ool-v2-lectura-v1',LKEY=()=>LKEYP+':'+V,LKEY_OLD_OWNER='Hope D66-42 — Luceplan',LNAME={D:'Determinístico',M:'Mixto',G:'Generativo'}; // etapa 01 (01/10): persistencia de la lectura aislada por id de lámpara · la clave global previa (LKEYP) sólo pudo contener ediciones de Hope: se lee para Hope si su clave nueva no existe, sin copiarla ni borrarla

const CHORDS={S:[['O3-3','O7-4'],['O3-4','O6-4'],['O8-5','C4-3'],['O6-3','C5-2'],['U3-6','C4-2'],['O5-4','U4-2'],['O3-2','C1-3'],['O7-1','U4-4']],
              W:[['O3-3','O7-5'],['O3-4','C2-1'],['O5-3','O6-2'],['O8-5','C4-2'],['U3-1','C4-4'],['O6-3','C5-2'],['O3-2','C1-3'],['O5-7','U4-2']]};
function metaOf(v){const m=(DATA[v]&&DATA[v].meta)||{};return {title:m.nombre||m.objeto||v,sub:[m.empresa,(m.disenadores||[]).join(' + '),m.anio].filter(Boolean).join(' · '),img:'img/'+(m.foto||m.dibujo||''),isPhoto:!!m.foto,objeto:m.objeto||v,estado:m.estado_ficha||''}}

let THEME='fgp'; /* Fran (04/09 14:24): se queda con su gráfica; el tema Vibia queda en el código pero sin botón */const TH=()=>THEMES[THEME]||THEMES.fgp;
function setTheme(t){THEME=THEMES[t]?t:'fgp';localStorage.setItem('ool-theme',THEME);document.body.dataset.theme=THEME;document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b.dataset.t===THEME));if(DATA){const open=$('#card').classList.contains('on');render();if(open)closeCard()}}
function applyTitles(d){Object.values(d).forEach(o=>o.planes.forEach(p=>p.zones.forEach(z=>{const pre=(z.fields[0]||{}).id?.split('-')[0];if(!z.name0)z.name0=z.name;if(pre&&TITLES.zones[pre])z.name=TITLES.zones[pre];z.fields.forEach(f=>{if(!f.name0)f.name0=f.name;if(TITLES.fields[f.id])f.name=TITLES.fields[f.id];if(!f.imp0)f.imp0=f.importancia;const g=(GRADES[o.version]||{})[f.id];if(g)f.importancia=g;f.titular=((GRADES.titulares||{})[o.version]||{})[f.id]||''})})))}
const pol=(r,a)=>[G.cx+r*Math.cos(a),G.cy+r*Math.sin(a)];
const jn=j=>{const n=parseInt((j||'').replace(/\D/g,''));return isNaN(n)?1:n};
function state(e){e=(e||'').toLowerCase();if(e.includes('conflicto'))return'conflicto';if(e.includes('desconocido'))return'desconocido';if(e.startsWith('documentado')||e.includes('medici'))return'documentado';if(e.startsWith('observado'))return'observado';if(e.startsWith('inferido'))return'inferido';if(e.startsWith('interpretado')||e.includes('hipótesis'))return'interpretado';return'otro'}
function hsv(h,s=TH().s,v=TH().v){h=((h%360)+360)%360;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return`rgb(${Math.round((r+m)*255)},${Math.round((g+m)*255)},${Math.round((b+m)*255)})`}

const el=(n,at={},parent)=>{const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e};

function arcPath(r,a0,a1){const am=(a0+a1)/2,bottom=Math.sin(am)>0;const L=(a1-a0)>Math.PI?1:0;if(!bottom){const [x0,y0]=pol(r,a0),[x1,y1]=pol(r,a1);return`M${x0} ${y0}A${r} ${r} 0 ${L} 1 ${x1} ${y1}`}const [x0,y0]=pol(r,a1),[x1,y1]=pol(r,a0);return`M${x0} ${y0}A${r} ${r} 0 ${L} 0 ${x1} ${y1}`}
function catmull(pts,samples=10){const out=[],N=pts.length;for(let i=0;i<N-1;i++){const p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,N-1)];for(let k=0;k<samples;k++){const t=k/samples;const cr=(v0,v1,v2,v3)=>.5*((2*v1)+(-v0+v2)*t+(2*v0-5*v1+4*v2-v3)*t*t+(-v0+3*v1-3*v2+v3)*t*t*t);out.push([cr(p0[0],p1[0],p2[0],p3[0]),cr(p0[1],p1[1],p2[1],p3[1])])}}out.push(pts[N-1]);return out}
const twidth=(s,fs)=>s.length*fs*.6;

function layout(d){
  const total=d.planes.reduce((n,p)=>n+p.zones.reduce((m,z)=>m+z.fields.length,0),0);
  const per=(2*Math.PI-G.GAPP*3)/total;let a=-Math.PI/2+G.GAPP/2;const PC=[];
  d.planes.forEach(p=>{p.a0=a;p.zones.forEach(z=>{z.a0=a;z.fields.forEach(f=>{f.a0=a;f.a1=a+per;f.am=a+per/2;a+=per});z.a1=a;z.am=(z.a0+z.a1)/2});p.a1=a;p.am=(p.a0+p.a1)/2;PC.push([p.am,HUE[p.id]??HUE[p.name]??200]);a+=G.GAPP});
  const hueAt=ang=>{for(let i=0;i<3;i++){let [c0,h0]=PC[i],[c1,h1]=PC[(i+1)%3];if(c1<c0)c1+=2*Math.PI;const aa=ang>=c0?ang:ang+2*Math.PI;if(aa>=c0&&aa<=c1){if(h1>h0)h1-=360;return h0+(h1-h0)*(aa-c0)/(c1-c0)}}return PC[0][1]};

  d.planes.forEach(p=>{const H=HUE[p.id]??HUE[p.name]??200,n=p.zones.length;p.zones.forEach((z,i)=>{const t=n>1?i/(n-1):.5;z.hue=H+(t-.5)*10;z.col=hsv(z.hue,TH().s*(0.82+0.36*t),TH().v*(1.14-0.28*t));z.deep=hsv(H,TH().ds,TH().dv);z.plane=p;z.fields.forEach(f=>{f.zone=z;f.plane=p})})});

}
